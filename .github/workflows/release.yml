name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for example v0.1.0)
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, cross: false }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Every archive ships the licence and the attribution notice, because
      # the binary contains code derived from Apache-2.0 sources.
      - name: Package
        shell: bash
        run: |
          name="sctxx-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ -f "target/${{ matrix.target }}/release/sctxx.exe" ]; then
            cp "target/${{ matrix.target }}/release/sctxx.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/sctxx" "dist/$name/"
          fi
          cp LICENSE NOTICE README.md CHANGELOG.md "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" 2>/dev/null \
            || sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Attest the binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/sctxx-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sctxx-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  publish:
    name: crates.io
    needs: release
    runs-on: ubuntu-latest
    # Publishing is irreversible: a version can be yanked but never reused.
    # The `crates-io` environment carries the human approval gate.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish, unless this version is already there
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Re-running a release must not fail on work that already succeeded.
          # crates.io cannot reuse a version, so the check is the version's
          # existence, not the exit code of the upload.
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "sctxx-release-workflow" \
            "https://crates.io/api/v1/crates/sctxx/$version")
          if [ "$code" = "200" ]; then
            echo "sctxx $version is already published on crates.io; nothing to do."
          else
            cargo publish --token "$CARGO_REGISTRY_TOKEN"
          fi

  npm:
    name: npm
    needs: release
    runs-on: ubuntu-latest
    # npm versions are immutable in the same way: a published version can be
    # deprecated but never reused. Same human gate as crates.io.
    environment: npm
    permissions:
      contents: read
      id-token: write # --provenance signs the tarballs with this job's OIDC identity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: The npm packages agree with the crate
        run: node npm/check-versions.cjs

      # The platform packages go first: the wrapper's optionalDependencies
      # cannot resolve until the versions they name exist on the registry.
      - name: Publish the platform packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./npm/sctxx/package.json').version")
          for target in $(node -p "Object.keys(require('./npm/platforms.json')).join('\n')"); do
            pkg=$(node -p "require('./npm/platforms.json')['$target'].package")
            bin=$(node -p "require('./npm/platforms.json')['$target'].binary")
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version is already published; skipping."
              continue
            fi
            rm -rf "/tmp/$target" && mkdir -p "/tmp/$target"
            tar -xzf "dist/sctxx-$target.tar.gz" -C /tmp
            mkdir -p "npm/$pkg/bin"
            install -m 0755 "/tmp/sctxx-$target/$bin" "npm/$pkg/bin/$bin"
            cp LICENSE NOTICE "npm/$pkg/"
            echo "::group::$pkg $version"
            ( cd "npm/$pkg" \
              && npm pkg set version="$version" \
              && npm publish --provenance --access public )
            echo "::endgroup::"
          done

      - name: Publish the wrapper
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./npm/sctxx/package.json').version")
          if npm view "sctxx@$version" version >/dev/null 2>&1; then
            echo "sctxx@$version is already published; nothing to do."
            exit 0
          fi
          cp LICENSE NOTICE npm/sctxx/
          cd npm/sctxx
          npm pkg set version="$version"
          for p in $(node -p "Object.values(require('../platforms.json')).map(v=>v.package).join('\n')"); do
            npm pkg set "optionalDependencies.$p=$version"
          done
          npm publish --provenance --access public
