name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: formatting, lints, and the rules that are specific to this
  # repository (vendor attribution, package contents).
  check:
    name: fmt, clippy, policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Vendored code keeps its Apache-2.0 attribution
        run: ./scripts/check-vendor-headers.sh

      - name: No codex-* dependency, and nothing unpublishable
        run: |
          if grep -nE '^codex[-_]' Cargo.toml; then
            echo "::error::sctxx must never depend on a codex-* crate (AGENTS.md rule 1)"
            exit 1
          fi
          if grep -nE '^\s*[a-z0-9_-]+\s*=\s*\{[^}]*(git|path)\s*=' Cargo.toml; then
            echo "::error::crates.io forbids git and path dependencies in published crates"
            exit 1
          fi

      - name: The crate ships its licence, prompts, schemas, and skill
        run: |
          list=$(cargo package --list --allow-dirty)
          for required in LICENSE NOTICE prompts/fold_system.md schemas/ops.v1.json skill/SKILL.md; do
            echo "$list" | grep -qx "$required" || {
              echo "::error::cargo package is missing $required"
              exit 1
            }
          done

      - name: The crate ships nothing but its own files
        run: |
          # `include` is matched the way gitignore is: a pattern with no leading
          # slash applies at every depth, so a bare `README.md` once dragged ~60
          # files out of website/node_modules into the tarball. Anything below
          # is a leak, not a packaging choice. `.cargo_vcs_info.json` and
          # `Cargo.toml.orig` are written by cargo itself.
          list=$(cargo package --list --allow-dirty)
          unexpected=$(echo "$list" | grep -vE '^(src/|prompts/|schemas/|skill/|LICENSE$|NOTICE$|README\.md$|CHANGELOG\.md$|Cargo\.toml$|Cargo\.toml\.orig$|Cargo\.lock$|\.cargo_vcs_info\.json$)' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected files in the crate tarball:"
            echo "$unexpected"
            exit 1
          fi

      - name: The npm packages agree with the crate
        run: |
          # Seven package.json files have to agree with Cargo.toml, and the
          # platform list with the release matrix. Manual agreement is not a
          # plan: a drift here publishes an installable package with no binary
          # in it, and npm versions cannot be reused.
          node npm/check-versions.cjs

      - name: The npm wrapper resolves a binary for every target it claims
        run: |
          # Every target in platforms.json must be one the shim maps, or
          # `npm i -g sctxx` installs a package that cannot run.
          shim=npm/sctxx/bin/sctxx.js
          missing=0
          for entry in $(node -p "Object.values(require('./npm/platforms.json')).map(v=>v.package).join('\n')"); do
            grep -q "\"$entry\"" "$shim" || { echo "::error::$entry is not in the shim's platform map"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Linux x86_64, os: ubuntu-latest }
          - { name: Windows x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (all features)
        run: cargo test --all-features

      # The minimal build must compile and pass with no network code at all.
      - name: Test (no default features)
        run: cargo test --no-default-features

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --all-targets

  cross:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked --version 0.2.5
      - name: Build
        run: cross build --release --target ${{ matrix.target }}
