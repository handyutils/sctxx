[package]
name = "sctxx"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Session ConTeXt eXtractor: turn a coding-agent session transcript (Claude Code, Codex CLI, Pi, and more) into a compact, verified, provenance-linked handoff artifact any other agent can continue from."
repository = "https://github.com/handyutils/sctxx"
homepage = "https://handyutils.github.io/sctxx"
documentation = "https://handyutils.github.io/sctxx"
readme = "README.md"
keywords = ["cli", "agent", "llm", "context", "handoff"]
categories = ["command-line-utilities", "development-tools"]
# Cargo matches these the way gitignore matches: a pattern without a leading
# slash applies at every depth. `README.md` therefore matched every README in
# the tree — including the ~60 inside `website/node_modules`, which is how a
# JS dependency tree ended up in the crate tarball. Every entry is anchored to
# the package root on purpose; keep it that way.
include = [
    "/src/**/*.rs",
    "/src/vendor/codex/README.md",
    "/prompts/**/*.md",
    "/schemas/**/*.json",
    "/skill/**",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/CHANGELOG.md",
]

[[bin]]
name = "sctxx"
path = "src/main.rs"

[lib]
name = "sctxx"
path = "src/lib.rs"

[features]
default = ["zstd", "api", "cli-backends"]
# read cold Codex rollouts stored as rollout-*.jsonl.zst
zstd = ["dep:zstd"]
# HTTP LLM backends (api:anthropic, api:openai, api:compat)
api = ["dep:ureq"]
# subprocess LLM backends (cli:claude, cli:codex, cli:pi); no extra dependencies
cli-backends = []

[dependencies]
# anyhow is used only at the binary edge (src/main.rs); library code uses thiserror.
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
ureq = { version = "2.10", default-features = false, features = [
    "json",
    "tls",
    "gzip",
], optional = true }
walkdir = "2.5"
zstd = { version = "0.13", optional = true }

[dev-dependencies]
assert_cmd = "2.0"
insta = { version = "1.41", features = ["json"] }
predicates = "3.1"
tempfile = "3.14"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sctxx-{ target }{ archive-suffix }"
bin-dir = "sctxx-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
